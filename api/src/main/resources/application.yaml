server:
    port: ${SERVER_PORT:8080}

spring:
    main:
        banner-mode: off
    application:
        name: storyteller-api
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/storyteller}
        password: postgres
        username: postgres
    liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    ai:
        model:
            chat: ollama
        ollama:
            base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
            embedding:
                model: mxbai-embed-large
        vectorstore:
            pgvector:
                index-type: hnsw
                distance-type: cosine-distance
                dimensions: 1024
                initialize-schema: true

logging:
    pattern:
        console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %magenta(%msg%n)"
    level:
        "[org.springframework.ai]": DEBUG
        "[es.vargontoc.storyteller]" : DEBUG
app:
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:80}
        allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
    chatterbox:
        base-url: ${CHATTERBOX_URL:http://localhost:4123}
        timeout-seconds: 90
        default-voice-name: nubi-npc-voice
        
    comfy:
        # -- General information
        base-url: ${COMFY_URL:http://localhost:8188}
        poll-interval-ms: 1000
        timeout-seconds: 120
        # -- Character template
        workflow-character-template: classpath:comfyui/workflow-character-template.json
        style-prefix: "children's book ilustration, soft watercolor style, warn color, simple shapes, gentle lighting"
        character-framing-prompt: "solo, single character, full body, character reference sheet, centered composition, plain simple background"
        negative-prompt: "photo, photorealistic, realistic, scary, dark, gore, violence, text, watermark, signature, extra limbs, desfigured"
        
        # -- Cover / Scene temprate
        workflow-page-template: classpath:comfyui/workflow-page-template.json
        page-negative-prompt: "photo, photorealistic, realistic, scary, dark, gore, violence, text, watermark, signature, extra limbs, disfigured, blurry, deformed"
        
        ## -- Page properties
        page-width: 768
        page-height: 576
        
        ## -- Cover properties
        cover-width: 576
        cover-height: 768
        cover-framing-prompt: "book cover illustration, protagonists featured together, inviting warn composition"
        
        # -- LoRa properties
        lora-name: "childrens_book_illustration2_.safetensors"
        lora-strength-model: 0.65
        lora-strength-clip: 0.65
        style-trigger-word: "Storybook Illustration art style"

        # -- IP Adapter
        ipadapter-model-name: "ip-adapter_sd15.safetensors"
        clip-vision-model-name: "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"
        max-reference-characters: 3
        ipadapter-weight-budget: 0.6
    agents:
        topics: "${APP_AGENT_TOPICS:storyteller-topics}"
        director: "${APP_AGENT_DIRECTOR:storyteller-director}"
        scriptwriter: "${APP_AGENT_SCRIPTWRITER:storyteller-scriptwriter}"
        translator: "${APP_AGENT_TRANSLATOR:qwen2.5:14b-instruct}"