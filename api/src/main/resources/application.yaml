server:
    port: ${SERVER_PORT:8080}

spring:
    main:
        banner-mode: off
    application:
        name: storyteller-api
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/storyteller}
        password: postgres
        username: postgres
    liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    ai:
        model:
            chat: ollama
        ollama:
            base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}

logging:
    pattern:
        console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"
    level:
        "[org.springframework.ai]": DEBUG

app:
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost, http://192.168.1.33}
        allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
    chatterbox:
        url: ${CHATTERBOX_URL:http://localhost:8081}