server:
    port: ${SERVER_PORT:8080}

spring:
    main:
        banner-mode: off
    application:
        name: storyteller-api
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/storyteller}
        password: postgres
        username: postgres
    liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    ai:
        model:
            chat: ollama
        ollama:
            base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
            embedding:
                model: mxbai-embed-large
        vectorstore:
            pgvector:
                index-type: hnsw
                distance-type: cosine-distance
                dimensions: 1024
                initialize-schema: true

logging:
    pattern:
        console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %magenta(%msg%n)"
    level:
        "[org.springframework.ai]": DEBUG
        "[es.vargontoc.storyteller]" : DEBUG
app:
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:80}
        allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
    chatterbox:
        base-url: ${CHATTERBOX_URL:http://localhost:4123}
        timeout-seconds: 90
        default-voice-name: nubi-npc-voice
        
    comfy:
        # -- General information
        base-url: ${COMFY_URL:http://localhost:8188}
        poll-interval-ms: 1000
        timeout-seconds: 180

        checkpoint-name: "sd_xl_base_1.0.safetensors"
        sampler-name: "euler"
        scheduler: "normal"
        steps: 30
        cfg: 7.0

        # -- Character template
        style-prefix: "children's book illustration, warm colors, simple shapes, gentle lighting"
        character-framing-prompt: "(solo:1.3), (one single character:1.3), full body portrait, centered composition, plain simple background"
        character-negative-prompt: "photo, photorealistic, realistic, scary, dark, gore, violence, text, watermark, signature, (extra limbs:1.4), (extra legs:1.4), (extra arms:1.4), (missing limbs:1.3), (malformed limbs:1.4), (bad anatomy:1.3), (mutated:1.3), (fused limbs:1.3), disfigured, (two characters:1.4), (multiple poses:1.4), (character sheet:1.4), (turnaround:1.4), (split screen:1.3), (multiple views:1.3), duplicate, clone, twins, multiple characters, group, crowd, background clutter, scenery, landscape, buildings, furniture, cluttered, busy background, frame, border, patterned background"
        
        # -- Cover / Scene temprate
        page-negative-prompt: "photo, photorealistic, realistic, scary, dark, gore, violence, text, watermark, signature, extra limbs, disfigured, blurry, deformed"
        cover-framing-prompt: "book cover illustration, protagonists featured together, inviting warn composition"
        
        ## -- Actor properties
        character-width: 1024
        character-height: 1024

        ## -- Page properties
        page-width: 1152
        page-height: 896
        
        ## -- Cover properties
        cover-width: 896
        cover-height: 1152
        
        # -- LoRa properties
        loras:
            - name: "StorybookRedmondV2-KidsBook-KidsRedmAF.safetensors"
              strength-model: 0.6
              strength-clip: 0.6
              trigger-word: "KidsRedmAF, Kids Book"
            - name: "CuteCartoonRedmond-CuteCartoon-CuteCartoonAF.safetensors"
              strength-model: 0.4
              strength-clip: 0.4
              trigger-word: "CuteCartoonAF, Cute Cartoon"

        # -- IP Adapter
        ipadapter-model-name: "ip-adapter-plus_sdxl_vit-h.safetensors"
        clip-vision-model-name: "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"
        max-reference-characters: 3
        ipadapterPreset: "PLUS (high strength)"
        ipadapter-weight-budget: 0.5
        
    agents:
        topics: "${APP_AGENT_TOPICS:storyteller-topics}"
        director: "${APP_AGENT_DIRECTOR:storyteller-director}"
        scriptwriter: "${APP_AGENT_SCRIPTWRITER:storyteller-scriptwriter}"
        translator: "${APP_AGENT_TRANSLATOR:qwen2.5:14b-instruct}"