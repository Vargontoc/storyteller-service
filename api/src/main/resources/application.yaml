server:
    port: ${SERVER_PORT:8080}

spring:
    main:
        banner-mode: off
    application:
        name: storyteller-api
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/storyteller}
        password: postgres
        username: postgres
    liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    ai:
        model:
            chat: ollama
        ollama:
            base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
            embedding:
                model: mxbai-embed-large
        vectorstore:
            pgvector:
                index-type: hnsw
                distance-type: cosine-distance
                dimensions: 1024
                initialize-schema: true

logging:
    pattern:
        console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %magenta(%msg%n)"
    level:
        "[org.springframework.ai]": DEBUG
        "[es.vargontoc.storyteller]" : DEBUG
app:
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost, http://192.168.1.33}
        allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
    chatterbox:
        url: ${CHATTERBOX_URL:http://localhost:8081}
    comfy:
        base-url: ${COMFY_URL:http://localhost:8188}
        workflow-character-template: classpath:comfyui/workflow-character-template.json
        poll-interval-ms: 1000
        timeout-seconds: 120
        style-prefix: "children's book ilustration, soft watercolor style, warn color, simple shapes, gentle lighting"
        character-framing-prompt: "solo, single character, full body, character reference sheet, centered composition, plain simple background"
        negative-prompt: "photo, photorealistic, realistic, scary, dark, gore, violence, text, watermark, signature, extra limbs, desfigured"
        lora-name: "childrens_book_illustration2_.safetensors"
        lora-strength-model: 0.85
        lora-strength-clip: 0.85
        style-trigger-word: "Storybook Illustration art style"
        background-removal-enabled: true
    agents:
        topics: "${APP_AGENT_TOPICS:storyteller-topics}"
        director: "${APP_AGENT_DIRECTOR:storyteller-director}"