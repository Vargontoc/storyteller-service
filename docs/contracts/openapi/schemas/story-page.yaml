# Origen: specs/agent-director (REQ-013, DEC-006)
# Estado del contrato: contrastado con el código
type: object
description: |
  Página de una historia (page = 0 identifica la portada). El beat aprobado de la escaleta es un contrato
  interno entre el servidor y el escritor al generar la página: no es un campo de esta representación ni
  es editable por el cliente (los beats se editan con PUT /generations/story/{id}/beat/{page})
additionalProperties: false
properties:
  id:
    type: integer
    format: int64
  storyId:
    type: integer
    format: int64
  page:
    type: integer
    description: Número de página; 0 es la portada
  coverText:
    type: string
    nullable: true
  text:
    type: string
  scene:
    type: string
    description: Prompt de escena usado para generar la imagen de la página
  imageAsset:
    type: string
    nullable: true
  audioAsset:
    type: string
    nullable: true
required:
  - id
  - page
