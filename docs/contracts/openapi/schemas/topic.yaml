type: object
description: Tema del catálogo interno para un cuento infantil
additionalProperties: false
properties:
  id:
    type: integer
    format: int64
    example: 12
  type:
    type: string
    description: Categoría del tema (aventuras, rutinas, animales, naturaleza, familia y amigos, juegos)
    example: Aventuras
  description:
    type: string
    example: Un viaje en globo entre las nubes
required:
  - id
  - type
  - description
