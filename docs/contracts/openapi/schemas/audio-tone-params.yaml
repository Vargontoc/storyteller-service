type: object
description: Parámetros de tono de voz personalizados (solo aplica con preset CUSTOM)
additionalProperties: false
properties:
  exageration:
    type: number
    format: double
    minimum: 0.25
    maximum: 2.0
  cfgWeight:
    type: number
    format: double
