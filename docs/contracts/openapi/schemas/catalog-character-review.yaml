# Origen: specs/character-inventory (REQ-007, REQ-010, REQ-011, REQ-012), specs/character-portraits (REQ-011, REQ-012)
# Estado del contrato: contrastado con el código
type: object
description: Vista de una revisión pendiente o resuelta de un personaje del catálogo
additionalProperties: false
properties:
  id:
    type: integer
    format: int64
    description: Identificador único de la revisión
  target:
    $ref: "./enums/character-review-target.yaml"
  hint:
    type: string
    description: Pista o cambio solicitado en lenguaje natural
  name:
    type: string
    description: Nombre del personaje en la revisión
  narrativeDescription:
    type: string
    description: Propuesta de descripción narrativa
  visualDescription:
    type: string
    description: Propuesta de descripción visual
  forkConfirmationRequired:
    type: boolean
    description: Indica si se requiere confirmación del usuario para crear un fork al afectar una revisión visual a un personaje usado en cuentos (REQ-011)
  forkCatalogCharacterId:
    type: integer
    format: int64
    nullable: true
    description: Identificador del personaje fork creado en el catálogo tras confirmar el aviso de fork (REQ-012)
required:
  - id
  - target
  - hint
  - name
  - narrativeDescription
  - visualDescription
  - forkConfirmationRequired
