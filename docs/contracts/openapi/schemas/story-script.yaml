# Origen: specs/agent-director (REQ-006, REQ-007, REQ-016, REQ-017, DEC-005), specs/export-import-feature (REQ-017, REQ-037, DEC-001)
# Estado del contrato: contrastado con el código
type: object
description: Guion vigente de un cuento. En un cuento anterior a la escaleta, scriptVersion es nulo, cast y beats van vacíos y cover es nulo. En guiones anteriores a export-import-feature, cover y el setting de cada beat son nulos
additionalProperties: false
properties:
  id:
    type: integer
    format: int64
    description: Identificador del cuento
  title:
    type: string
  synopsis:
    type: string
  status:
    allOf:
      - $ref: "./enums/story-status.yaml"
    nullable: true
  scriptVersion:
    type: integer
    nullable: true
    description: Marcador de versión de guion. 1 = escaleta contractual; nulo = cuento antiguo sin escaleta
  cast:
    type: array
    items:
      $ref: "./episodic-cast-member.yaml"
  beats:
    type: array
    description: Escaleta ordenada por página. Mismos campos que story-beat.yaml más el número de página explícito
    items:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 1
          description: Página interior (desde 1); misma numeración que changedBeats y que el path de edición de beat
        event:
          type: string
        narrativeFunction:
          type: string
        participants:
          type: array
          items:
            type: string
        tone:
          type: string
        visualNote:
          type: string
        setting:
          type: string
          nullable: true
          description: Lugar o ambiente de la escena (obligatorio y no vacío en guiones nuevos; nulo en guiones anteriores a export-import-feature)
      required:
        - page
        - event
        - narrativeFunction
        - participants
        - tone
        - visualNote
        - setting
  cover:
    allOf:
      - $ref: "./cover-plan.yaml"
    nullable: true
    description: Planteamiento propio de la portada (lugar y tono). Nulo en cuentos sin escaleta o anteriores a export-import-feature
required:
  - id
  - title
  - synopsis
  - cast
  - beats
