# Origen: specs/character-inventory (REQ-010)
# Estado del contrato: contrastado con el código
get:
  operationId: getPendingCatalogCharacterReview
  summary: Obtiene la revisión pendiente de un personaje del catálogo
  description: Devuelve los datos de la propuesta de revisión activa (PENDING) asociada al personaje del catálogo (REQ-010)
  tags:
    - CatalogCharacters
  parameters:
    - name: characterId
      in: path
      required: true
      description: Identificador del personaje del catálogo
      schema:
        type: integer
        format: int64
  responses:
    "200":
      description: Revisión pendiente encontrada
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/catalog-character-review-response.yaml"
    "404":
      description: No existe una revisión pendiente para el personaje indicado
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
