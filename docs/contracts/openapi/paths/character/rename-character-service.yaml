# Origen: specs/character-inventory (REQ-006)
# Estado del contrato: contrastado con el código
patch:
  operationId: renameCatalogCharacter
  summary: Renombra un personaje en el catálogo
  description: Actualiza el nombre del personaje maestro en el catálogo. No altera el nombre de las instantáneas de cuentos ya existentes (REQ-006, DEC-005).
  tags:
    - CatalogCharacters
  parameters:
    - name: id
      in: path
      required: true
      description: Identificador del personaje del catálogo
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/requests/rename-catalog-character-request.yaml"
  responses:
    "200":
      description: Personaje renombrado en el catálogo
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/catalog-character-response.yaml"
    "400":
      description: Nombre inválido
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "404":
      description: Personaje no encontrado
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
