# Origen: specs/character-inventory (REQ-007, REQ-008, REQ-009), specs/character-portraits (REQ-006, REQ-009), specs/agent-writer (REQ-032, DEC-002)
# Estado del contrato: contrastado con el código
post:
  operationId: requestCatalogCharacterReview
  summary: Solicita una revisión de un personaje del catálogo
  description: Solicita una revisión textual. Rechaza la operación con 409 si el personaje está bloqueado por una generación de retratos en curso (REQ-006). Si ya existe una revisión pendiente y replacePending=false, devuelve replacementConfirmationRequired=true (REQ-007). Si la propuesta modifica la descripción visual y existen imágenes generadas (retrato aprobado o candidatos), incluye visualConsistencyWarning=true (REQ-009). Si no cumple las reglas, devuelve accepted=false con rejectionReason (REQ-008).
  tags:
    - CatalogCharacters
  parameters:
    - name: characterId
      in: path
      required: true
      description: Identificador del personaje del catálogo
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/requests/request-catalog-character-review-request.yaml"
  responses:
    "200":
      description: Resultado de la solicitud de revisión
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/catalog-character-review-request-result-response.yaml"
    "400":
      description: Solicitud inválida, propuesta incompleta o agente no disponible
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "404":
      description: Personaje no encontrado en el catálogo
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "409":
      description: El personaje tiene una generación de retratos en curso (REQ-006) o hay una generación en curso en la aplicación (REQ-032)
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "503":
      description: El servicio de condición de imágenes no está disponible
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
