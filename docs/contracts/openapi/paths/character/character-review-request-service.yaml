# Origen: specs/character-inventory (REQ-007, REQ-008, REQ-009)
# Estado del contrato: contrastado con el código
post:
  operationId: requestCatalogCharacterReview
  summary: Solicita una revisión de un personaje del catálogo
  description: Solicita una revisión textual. Si ya existe una pendiente y replacePending=false, devuelve replacementConfirmationRequired=true (REQ-007). Si la propuesta modifica la descripción visual y hay imágenes generadas, incluye visualConsistencyWarning=true (REQ-009). Si no cumple las reglas, devuelve accepted=false con rejectionReason (REQ-008).
  tags:
    - CatalogCharacters
  parameters:
    - name: characterId
      in: path
      required: true
      description: Identificador del personaje del catálogo
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/requests/request-catalog-character-review-request.yaml"
  responses:
    "200":
      description: Resultado de la solicitud de revisión
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/catalog-character-review-request-result-response.yaml"
    "400":
      description: Solicitud inválida o agente no disponible
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "404":
      description: Personaje no encontrado en el catálogo
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
