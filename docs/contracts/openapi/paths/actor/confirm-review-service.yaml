# Origen: specs/character-inventory (REQ-011, REQ-012)
# Estado del contrato: contrastado con el código
post:
  operationId: confirmActorReview
  summary: Confirma o descarta la revisión de un personaje del catálogo
  description: Aplica (CONFIRMED) los cambios de la revisión a la ficha del personaje del catálogo o la descarta (DISCARDED) conservando la ficha actual
  tags:
    - Reviews
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/requests/confirm-review-request.yaml"
  responses:
    "200":
      description: Personaje del catálogo resultante tras la confirmación o el descarte
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/actor-response.yaml"
    "409":
      description: No hay una revisión pendiente para el personaje indicado
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
