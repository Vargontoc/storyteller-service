# Origen: specs/character-inventory (REQ-007, REQ-008, REQ-009)
# Estado del contrato: contrastado con el código
post:
  operationId: reviewActor
  summary: Solicita una revisión de un personaje del catálogo
  description: Solicita una revisión del personaje del catálogo mediante el agente. Incluye respuestas de rechazo, confirmación de descarte previo si ya existía una pendiente (ALT-002) y aviso de consistencia visual si existen imágenes previas (ALT-003).
  tags:
    - Reviews
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/requests/actor-review-command.yaml"
  responses:
    "200":
      description: Revisión generada correctamente
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/actor-review-response.yaml"
    "400":
      description: El agente encargado de esta operación no está disponible o la petición es inválida
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "404":
      description: Personaje no encontrado en el catálogo
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
