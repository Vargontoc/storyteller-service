post:
  operationId: reviewStoryPage
  summary: Solicita una revisión de una página
  description: El agente genera una revisión de una página existente según el hint del usuario
  tags:
    - Reviews
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/requests/story-page-review-command.yaml"
  responses:
    "200":
      description: Revisión generada correctamente
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/story-page-review-response.yaml"
    "400":
      description: El agente encargado de esta operación no está disponible
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
