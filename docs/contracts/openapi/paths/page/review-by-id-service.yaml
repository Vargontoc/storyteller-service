get:
  operationId: getStoryPageReview
  summary: Obtiene la revisión pendiente de una página
  description: Devuelve la revisión activa (PENDING) asociada a una página
  tags:
    - Reviews
  parameters:
    - name: pageId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    "200":
      description: Revisión encontrada
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/story-page-review-response.yaml"
    "404":
      description: No existe una revisión pendiente para la página indicada
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
