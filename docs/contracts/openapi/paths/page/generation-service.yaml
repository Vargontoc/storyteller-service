post:
  operationId: generateStoryPage
  summary: Genera una nueva página
  description: El agente genera la siguiente página (o la portada) de una historia existente
  tags:
    - Generators
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/requests/story-page-generate-command.yaml"
  responses:
    "200":
      description: Página generada correctamente
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/story-page-response.yaml"
    "400":
      description: El agente encargado de esta operación no está disponible
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "409":
      description: Ya se alcanzó el máximo de páginas, o ya existe portada para la historia
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
