# Origen: specs/agent-writer (REQ-016, REQ-017, REQ-018, REQ-028, REQ-031, REQ-033, REQ-038, REQ-041, ALT-004, ALT-012)
# Estado del contrato: contrastado con el código
post:
  operationId: acceptStoryPageProposal
  summary: Acepta la propuesta vigente de una portada o página aceptada reabierta
  description: |
    Acepta la propuesta vigente de una portada o página aceptada reabierta. Si existen páginas posteriores (nunca ocurre en la portada)
    y confirm es false (valor por defecto), no cambia nada y responde 200 con requiresConfirmation=true y affectedPages indicando cuántas
    páginas se eliminarán. Con confirm=true (o sin páginas posteriores), sustituye el contenido aceptado sin imagen (desasociando cualquier
    imagen previa), borra el histórico de propuestas y elimina en cascada las páginas posteriores junto con sus históricos e imágenes,
    sin regenerar nada. Si el cuento estaba en PAGES_ACCEPTED y se eliminan páginas, vuelve a SCRIPT_ACCEPTED.
  tags:
    - Storyteller
  parameters:
    - name: storyId
      in: path
      required: true
      description: Identificador del cuento
      schema:
        type: integer
        format: int64
    - name: id
      in: path
      required: true
      description: Identificador de la portada o página (StoryPage.id)
      schema:
        type: integer
        format: int64
    - name: confirm
      in: query
      required: false
      description: Confirmación explícita del descarte en cascada de páginas posteriores (por defecto false)
      schema:
        type: boolean
        default: false
  responses:
    "200":
      description: Solicitud de confirmación (requiresConfirmation=true) o propuesta aceptada (requiresConfirmation=false)
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/proposal-accepted-response.yaml"
    "404":
      description: La página no existe o no pertenece al cuento
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "409":
      description: |
        La página no está en estado ACCEPTED, no tiene propuestas pendientes, no tiene versión vigente, su propuesta vigente tiene aviso
        de número de frases (REQ-028), o hay una generación en curso de ese cuento (REQ-033)
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
