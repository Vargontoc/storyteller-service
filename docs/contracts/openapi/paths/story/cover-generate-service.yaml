# Origen: specs/agent-writer (REQ-001, REQ-020, REQ-032, DEC-003, DEC-010, ALT-003), specs/export-import-feature (REQ-038, DEC-004, ALT-006)
# Estado del contrato: contrastado con el código
post:
  operationId: generateStoryCover
  summary: Inicia la generación asíncrona de la escena de portada
  description: |
    Solicita generar la escena de portada de un cuento con escaleta y guion aprobado (SCRIPT_ACCEPTED) que aún no tiene portada,
    usando el lugar y el tono propios de la portada del guion. Esta misma generación se lanza automáticamente al aprobar el guion
    (POST /generations/story/{id}/approve) y puede invocarse manualmente aquí (por ejemplo si el lanzamiento automático devolvió coverStarted=false).
    Exige que el guion tenga lugar y tono de portada; si faltan, rechaza con 409 antes de pedir turno y sin llamar al escritor (ALT-006).
    Pide turno a generation-gate; al concederlo responde 202 con GenerationStarted (pageNumber = 0). El resultado llega después
    por WebSocket en /storyteller (STARTED, VERSION_PRESENTED o FAILED). La portada usa el título del guion sin modificarlo,
    no tiene texto narrativo ni imagen inicial (solo puede asociársele una imagen importada una vez aceptada), y no pasa por la validación de longitud.
  tags:
    - Storyteller
  parameters:
    - name: storyId
      in: path
      required: true
      description: Identificador del cuento
      schema:
        type: integer
        format: int64
  responses:
    "202":
      description: Turno concedido y generación de portada iniciada en segundo plano
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/generation-started-response.yaml"
    "404":
      description: El cuento no existe
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "409":
      description: |
        El cuento es anterior a la escaleta, ya tiene todas las páginas aceptadas (PAGES_ACCEPTED), el guion no está aprobado
        (distinto de SCRIPT_ACCEPTED), al guion le faltan el lugar y el tono propios de la portada (cuentos anteriores a
        export-import-feature; se rechaza sin pedir turno ni llamar al escritor), ya existe portada para el cuento, o hay una
        generación en curso en la aplicación (REQ-032)
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
