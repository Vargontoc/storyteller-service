# Origen: specs/agent-director (REQ-008, REQ-009, REQ-018, ALT-003, DEC-001), specs/agent-writer (REQ-032, DEC-002)
# Estado del contrato: contrastado con el código
post:
  operationId: reviewStory
  summary: Solicita una revisión global del guion
  description: |
    El director revisa la escaleta completa según el hint del usuario. Descarta antes la revisión pendiente anterior.
    Si acepta el hint, la revisión queda PENDING con la escaleta candidata completa y changedBeats. Si lo rechaza
    (reglas de edad o coherencia), responde 200 con hintAccepted=false y rejectedReason, la revisión queda DISCARDED
    y la escaleta vigente no cambia. No admite cuentos anteriores a la escaleta.
  tags:
    - Reviews
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/requests/story-review-command.yaml"
  responses:
    "200":
      description: Revisión generada (aceptada o rechazada)
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/story-review-response.yaml"
    "400":
      description: El director no está disponible o no devolvió una respuesta válida tras 3 intentos
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "404":
      description: El cuento o su escaleta no existe
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "409":
      description: El cuento es anterior a la escaleta y no admite revisión del guion, o hay una generación en curso en la aplicación (REQ-032)
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
