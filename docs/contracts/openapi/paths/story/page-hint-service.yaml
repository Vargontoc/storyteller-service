# Origen: specs/agent-writer (REQ-012, REQ-013, REQ-014, REQ-015, REQ-032, DEC-003, ALT-003, ALT-005, ALT-006)
# Estado del contrato: contrastado con el código
post:
  operationId: hintStoryPage
  summary: Solicita un cambio con hint sobre la portada o una página (pendiente o aceptada)
  description: |
    Envía un hint obligatorio sobre la portada (página 0) o una página de un cuento con escaleta. Si está PENDING, parte de su
    versión vigente y añade la nueva versión al histórico; si está ACCEPTED, reabre la página guardando la propuesta en el histórico
    de propuestas sin modificar el contenido aceptado ni su imagen (en hints posteriores parte de la propuesta vigente).
    Pide turno a generation-gate; al concederlo responde 202 con GenerationStarted. El resultado llega por WebSocket en /storyteller
    (STARTED, VERSION_PRESENTED, HINT_REJECTED con motivo o FAILED).
  tags:
    - Storyteller
  parameters:
    - name: storyId
      in: path
      required: true
      description: Identificador del cuento
      schema:
        type: integer
        format: int64
    - name: id
      in: path
      required: true
      description: Identificador de la portada o página (StoryPage.id)
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/requests/page-hint-request.yaml"
  responses:
    "202":
      description: Turno concedido y generación con hint iniciada en segundo plano
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/generation-started-response.yaml"
    "400":
      description: El hint es nulo, vacío o solo contiene espacios (REQ-013)
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "404":
      description: El cuento o la página no existe, o la página no pertenece al cuento
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "409":
      description: |
        La página no tiene un estado válido (PENDING o ACCEPTED), no tiene versión vigente ni beat asociado en la escaleta,
        o hay una generación en curso en la aplicación (REQ-032)
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
