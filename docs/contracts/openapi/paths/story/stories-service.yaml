get:
  operationId: getStory
  summary: Obtiene una historia
  description: Obtiene la información de una historia (guión, personajes y páginas)
  tags:
    - Stories
  parameters:
    - name: storyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    "200":
      description: Historia encontrada
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/story-response.yaml"
    "404":
      description: No existe una historia con el id indicado
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
