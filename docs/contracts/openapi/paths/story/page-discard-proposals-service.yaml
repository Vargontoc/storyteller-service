# Origen: specs/agent-writer (REQ-030, REQ-031, REQ-033, ALT-004, ALT-013)
# Estado del contrato: contrastado con el código
post:
  operationId: discardStoryPageProposals
  summary: Descarta todas las propuestas de una portada o página aceptada reabierta
  description: |
    Operación síncrona que elimina el histórico completo de propuestas de una portada o página aceptada reabierta, conservando
    intactos su contenido aceptado, su imagen importada (si la tiene) y todas las páginas posteriores. Se rechaza si hay una
    generación en curso de ese cuento (REQ-033).
  tags:
    - Storyteller
  parameters:
    - name: storyId
      in: path
      required: true
      description: Identificador del cuento
      schema:
        type: integer
        format: int64
    - name: id
      in: path
      required: true
      description: Identificador de la portada o página (StoryPage.id)
      schema:
        type: integer
        format: int64
  responses:
    "200":
      description: Propuestas descartadas correctamente
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/proposals-discarded-response.yaml"
    "404":
      description: La página no existe o no pertenece al cuento
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
    "409":
      description: La página no está en estado ACCEPTED, no tiene propuestas que descartar o hay una generación en curso de ese cuento (REQ-033)
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
