get:
  operationId: getStorytellerStories
  summary: Lista los cuentos (paginado)
  description: Obtiene un listado paginado de resúmenes de historias
  tags:
    - Storyteller
  parameters:
    - name: page
      in: query
      required: false
      description: Página solicitada (0-indexada)
      schema:
        type: integer
        default: 0
    - name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 10
  responses:
    "200":
      description: Listado paginado de historias
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/story-summary-page-response.yaml"
