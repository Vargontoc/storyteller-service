# Origen: specs/agent-writer (REQ-022, REQ-023, DEC-007)
# Estado del contrato: contrastado con el código
get:
  operationId: getStorytellerPage
  summary: Obtiene la portada o una página de un cuento
  description: |
    En cuentos con escaleta devuelve PageDetail con su estado, beat asociado, contenido aceptado (con hasImage), histórico de versiones
    o propuestas y acciones disponibles. En cuentos antiguos sin escaleta conserva PageSummary.
  tags:
    - Storyteller
  parameters:
    - name: storyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    "200":
      description: Detalle de la página (cuento con escaleta) o resumen (cuento antiguo sin escaleta)
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "../../schemas/responses/page-detail-response.yaml"
              - $ref: "../../schemas/responses/page-summary-response.yaml"
    "404":
      description: No existe el cuento o la página indicada
      content:
        application/json:
          schema:
            $ref: "../../schemas/api-response.yaml"
