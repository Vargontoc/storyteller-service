get:
  operationId: getTopics
  summary: Lista el catálogo interno de temas
  description: Obtiene los temas del catálogo interno con los que se crean los cuentos. El catálogo es fijo y se carga por migración; no se generan temas.
  tags:
    - Topics
  responses:
    "200":
      description: Catálogo de temas
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/topics-list-response.yaml"
