openapi: 3.0.0
info:
  title: Storyteller API
  version: 1.0.0

servers:
  - url: /api/v1

security: []

tags:
  - name: Api
    description: Estado de los servicios externos de la aplicación
  - name: Generators
    description: Generación de contenido mediante agentes (historias, páginas)
  - name: Reviews
    description: Revisión, confirmación y descarte de contenido generado
  - name: Assets
    description: Generación de imágenes y audio
  - name: Storyteller
    description: Consulta, listado y borrado de cuentos, personajes y páginas
  - name: Topics
    description: Catálogo interno de temas para cuentos
  - name: CatalogCharacters
    description: Catálogo maestro de protagonistas reutilizables y sus revisiones

paths:
  /services:
    $ref: "./paths/api/services-service.yaml"

  /assets/images/generate:
    $ref: "./paths/assets/image-service.yaml"
  /assets/audios/generate:
    $ref: "./paths/assets/audio-service.yaml"

  /generations/story:
    $ref: "./paths/story/generation-service.yaml"
  /generations/story/{id}/approve:
    $ref: "./paths/story/approve-service.yaml"
  /generations/story/{id}/script:
    $ref: "./paths/story/script-service.yaml"
  /generations/story/{id}/beat/{page}:
    $ref: "./paths/story/beat-edit-service.yaml"
  /generations/page:
    $ref: "./paths/page/generation-service.yaml"

  /reviews/story:
    $ref: "./paths/story/review-service.yaml"
  /reviews/story/{storyId}:
    $ref: "./paths/story/review-by-id-service.yaml"
  /reviews/story/confirm:
    $ref: "./paths/story/confirm-review-service.yaml"

  /reviews/actor:
    $ref: "./paths/actor/review-service.yaml"
  /reviews/actor/{actorId}:
    $ref: "./paths/actor/review-by-id-service.yaml"
  /reviews/actor/confirm:
    $ref: "./paths/actor/confirm-review-service.yaml"

  /reviews/page:
    $ref: "./paths/page/review-service.yaml"
  /reviews/page/{pageId}:
    $ref: "./paths/page/review-by-id-service.yaml"
  /reviews/page/confirm:
    $ref: "./paths/page/confirm-review-service.yaml"

  /topic:
    $ref: "./paths/topic/topics-service.yaml"

  /storyteller:
    $ref: "./paths/storyteller/stories-service.yaml"
  /storyteller/{storyId}:
    $ref: "./paths/storyteller/story-service.yaml"
  /storyteller/{storyId}/actors:
    $ref: "./paths/storyteller/actors-service.yaml"
  /storyteller/{storyId}/actors/{id}:
    $ref: "./paths/storyteller/actor-service.yaml"
  /storyteller/{storyId}/pages:
    $ref: "./paths/storyteller/pages-service.yaml"
  /storyteller/{storyId}/pages/{id}:
    $ref: "./paths/storyteller/page-service.yaml"
  /storyteller/asset:
    $ref: "./paths/storyteller/asset-service.yaml"

  /catalog-characters:
    $ref: "./paths/character/catalog-characters-service.yaml"
  /catalog-characters/{id}:
    $ref: "./paths/character/catalog-character-service.yaml"
  /catalog-characters/{id}/name:
    $ref: "./paths/character/rename-character-service.yaml"
  /catalog-characters/{id}/portraits/generate:
    $ref: "./paths/character/character-portrait-generate-service.yaml"
  /catalog-characters/{id}/portraits/candidates:
    $ref: "./paths/character/character-portrait-candidates-service.yaml"
  /catalog-characters/{id}/portraits/candidates/{candidateId}/select:
    $ref: "./paths/character/character-portrait-select-service.yaml"
  /catalog-characters/{id}/portraits/candidates/{candidateId}/asset:
    $ref: "./paths/character/character-portrait-candidate-asset-service.yaml"
  /catalog-characters/{id}/portraits/approved/asset:
    $ref: "./paths/character/character-portrait-approved-asset-service.yaml"
  /catalog-characters/{id}/portraits/generating:
    $ref: "./paths/character/character-portrait-generating-service.yaml"
  /catalog-characters/{characterId}/reviews:
    $ref: "./paths/character/character-review-request-service.yaml"
  /catalog-characters/{characterId}/reviews/pending:
    $ref: "./paths/character/character-review-pending-service.yaml"
  /catalog-characters/{characterId}/reviews/{reviewId}/resolution:
    $ref: "./paths/character/character-review-resolution-service.yaml"
